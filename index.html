  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>NIMT UniOs</title>

    <!-- Google Tag Manager — public marketing-site containers.
         The same build can be served from multiple hostnames; choose the GTM
         container by hostname and keep it off the internal CRM hostname. -->
    <script>
      (function(w,d,s,l){
        var host = (w.location.hostname || "").toLowerCase();
        var containers = {
          "nimt.ac.in": "GTM-NHC65VZ",
          "www.nimt.ac.in": "GTM-NHC65VZ",
          "miraischool.in": "GTM-WL5MTC3D",
          "www.miraischool.in": "GTM-WL5MTC3D",
          "school.nimt.ac.in": "GTM-M9J8RJ7V",
          "seralislab.com": "GTM-NN2LQW8T",
          "www.seralislab.com": "GTM-NN2LQW8T"
        };
        var i = containers[host];
        if (!i) return;
        w[l]=w[l]||[];
        w[l].push({"gtm.start": new Date().getTime(), event: "gtm.js"});
        var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!="dataLayer" ? "&l="+l : "";
        j.async=true;
        j.src="https://www.googletagmanager.com/gtm.js?id="+i+dl;
        f.parentNode.insertBefore(j,f);
      })(window,document,"script","dataLayer");
    </script>

    <!-- Google Analytics — UniOs-wide property, fires on every surface
         (CRM + apply). The apply-portal-gated block below adds a second,
         apply-only property that's wired up with cross-domain linker. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9TPSZXEVZ3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9TPSZXEVZ3');
    </script>

    <!-- Google Analytics + Meta Pixel — apply portal only.
         The same SPA also serves the internal CRM (uni.nimt.ac.in/dashboard
         etc.); we only fire trackers when the visitor is on an applicant-facing
         path. Tracked surfaces: apply.nimt.ac.in (any path) and
         uni.nimt.ac.in/apply/* (since nimt.ac.in 'Apply Now' buttons link
         there). Each brand has its own Meta Pixel; the one matching the
         /apply/{brand} segment is initialized. -->
    <script>
      (function () {
        var host = window.location.hostname;
        var path = window.location.pathname;
        var inApply =
          host === "apply.nimt.ac.in" ||
          (host === "uni.nimt.ac.in" && path.indexOf("/apply") === 0);
        if (!inApply) return;

        // ── Google Analytics ──
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-MKHMKH1DE9";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", "G-MKHMKH1DE9", {
          // linker.domains keeps the same client_id when users navigate from
          // nimt.ac.in / miraischool.in / school.nimt.ac.in into apply
          linker: { domains: ["nimt.ac.in", "miraischool.in", "school.nimt.ac.in"] }
        });

        // ── Meta Pixel — brand-aware ──
        // Mirrors detectPortal() in src/components/apply/portalConfig.ts:
        // last path segment > ?portal= query > nimt default.
        var PIXELS = {
          nimt:   "2580313152286928",
          beacon: "511947283685367",
          mirai:  "1461957365199748"
        };
        var portal = "nimt";
        var segs = path.split("/").filter(function (x) { return x; });
        var last = (segs[segs.length - 1] || "").toLowerCase();
        if (PIXELS[last]) {
          portal = last;
        } else {
          var qp = (new URLSearchParams(window.location.search).get("portal") || "").toLowerCase();
          if (PIXELS[qp]) portal = qp;
        }

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', PIXELS[portal]);
        window.fbq('track', 'PageView');
      })();
    </script>
  </head>

  <body>
    <!-- Meta Pixel noscript fallback. Lives in <body> (browsers disallow
         <img> inside <noscript> in <head>). The SPA needs JS anyway, so a
         no-JS visitor never reaches the form — this fallback is purely for
         crawlers/preview cards. Brand isn't known at HTML load, so we fall
         back to the parent NIMT college pixel. -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2580313152286928&ev=PageView&noscript=1"
      alt=""
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
