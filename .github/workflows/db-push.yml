name: Supabase DB push

# Closes the gap that left ~15 migrations in git unapplied for weeks:
# every PR gets a dry-run diff; every merge to main triggers an actual apply.
#
# The workflow uses the Supabase CLI's `db push` which compares local
# migration files against the remote schema_migrations table and only runs
# what's missing. Migrations already applied via Studio / MCP are skipped
# (they're recorded in schema_migrations with their original timestamp).
#
# Required repository secrets (set under Settings → Secrets → Actions, or
# under the production-db Environment for reviewer-gated pushes):
#   SUPABASE_ACCESS_TOKEN   — personal access token (account settings → access tokens)
#   SUPABASE_PROJECT_REF    — the project ref (deylhigsisuexszsmypq for UniOs)
#   SUPABASE_DB_PASSWORD    — database password (project settings → database)
#
# Both jobs probe for the secrets at the top of the run and fail closed with
# a clear message if they're missing. A green migration check must mean the
# remote database was actually reachable.
#
# Safety:
#   • On PRs we only run --dry-run. No write happens until a human merges.
#   • The production job uses the `production-db` GitHub Environment so you
#     can add required reviewers if you want one-click approval before each
#     push (Settings → Environments → production-db → required reviewers).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize pushes to the same target so two merges can't race a db push.
  group: db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run migration diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Hoist secrets to job level so every step (including the link CLI
      # call) sees them without per-step duplication.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing+=(SUPABASE_PROJECT_REF)
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Supabase secrets missing::Cannot validate migrations: ${missing[*]} are not set. Add them under Settings → Secrets and variables → Actions. See docs/db-deploy-audit.md for the full list."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration push
        # --dry-run already fails non-zero on drift (remote-only versions,
        # local versions inserted before the last remote, duplicate-key
        # collisions). Pending branch migrations are OK on PRs as long as
        # Supabase can apply them after merge.
        run: npm run db:migrations:check

  push:
    name: Apply migrations to production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `environment: production-db` is retained ONLY for secret scoping —
    # SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD
    # live as Environment Secrets on this environment, not as repo-level
    # Actions secrets. Dropping the binding (PR #48) silently broke prod
    # pushes because `${{ secrets.* }}` returns empty without the
    # environment scope.
    #
    # The manual-approval gate that previously hung off this environment
    # added latency without catching real failures (collisions / drift) —
    # we rely on the PR-level dry-run (blocking via branch protection) +
    # the daily drift-detection workflow instead. If the env still has a
    # required-reviewers config, clear it under Settings → Environments
    # → production-db rather than removing this directive.
    environment: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse branch manual production push
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Manual db push must run from main::This workflow applies migrations to production. Re-run it from the main branch so branch-only migration files cannot be recorded in production before they exist on main."
          exit 1

      - name: Verify secrets
        # For the push path we WANT to fail loudly: a missing secret means
        # nothing got applied, which is silent data drift waiting to happen.
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing+=(SUPABASE_PROJECT_REF)
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Supabase secrets missing::Cannot apply migrations: ${missing[*]} are not set. Add them under Settings → Environments → production-db → Environment secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: supabase db push

      - name: Verify production has no pending migrations
        run: npm run db:migrations:clean
