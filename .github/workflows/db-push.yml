name: Supabase DB push

# Closes the gap that left ~15 migrations in git unapplied for weeks:
# every PR gets a dry-run diff; every merge to main triggers an actual apply.
#
# The workflow uses the Supabase CLI's `db push` which compares local
# migration files against the remote schema_migrations table and only runs
# what's missing. Migrations already applied via Studio / MCP are skipped
# (they're recorded in schema_migrations with their original timestamp).
#
# Required repository secrets (set under Settings → Secrets → Actions, or
# under the production-db Environment for reviewer-gated pushes):
#   SUPABASE_ACCESS_TOKEN   — personal access token (account settings → access tokens)
#   SUPABASE_PROJECT_REF    — the project ref (deylhigsisuexszsmypq for UniOs)
#   SUPABASE_DB_PASSWORD    — database password (project settings → database)
#
# Both jobs probe for the secrets at the top of the run and fail closed with
# a clear message if they're missing. A green migration check must mean the
# remote database was actually reachable.
#
# Safety:
#   • On PRs we only run --dry-run. No write happens until a human merges.
#   • The production job uses the `production-db` GitHub Environment so you
#     can add required reviewers if you want one-click approval before each
#     push (Settings → Environments → production-db → required reviewers).

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize pushes to the same target so two merges can't race a db push.
  group: db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run migration diff
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    environment: production-db
    env:
      # Hoist secrets to job level so the migration health script can link to
      # Supabase without per-step duplication.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: migration_changes
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            HEAD="${{ github.event.merge_group.head_sha }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          if git diff --name-only "$BASE" "$HEAD" | grep -q '^supabase/migrations/.*\.sql$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed; running Supabase dry-run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed; skipping live Supabase dry-run for this PR."
          fi

      # Cross-PR collision guard. The Supabase CLI (and the health script's
      # within-tree uniqueness check) only see one branch at a time, so two
      # PRs that each hand-write the same day's "YYYYMMDD120000" timestamp
      # both pass in isolation and only collide AFTER both merge to main —
      # which is precisely the failure that stranded ~15 migrations. Here we
      # fail the PR if a migration file it ADDS reuses a timestamp that
      # already exists on origin/main. Fix: `npm run db:migration:new -- <name>`
      # stamps a real UTC-second timestamp that cannot collide.
      - name: Reject migration timestamp reused from main
        if: steps.migration_changes.outputs.changed == 'true'
        run: |
          git fetch --no-tags origin main
          git ls-tree -r --name-only origin/main -- supabase/migrations \
            | grep -oE '[0-9]{14}' | sort -u > /tmp/main_versions.txt
          git diff --name-only --diff-filter=A "origin/main...HEAD" -- supabase/migrations \
            | grep -oE '[0-9]{14}' | sort -u > /tmp/added_versions.txt
          collisions=$(comm -12 /tmp/added_versions.txt /tmp/main_versions.txt)
          if [ -n "$collisions" ]; then
            echo "::error title=Migration timestamp collides with main::This PR adds migration file(s) whose 14-digit timestamp already exists on main: $(echo $collisions). Rename to a unique timestamp — run 'npm run db:migration:new -- <name>' which stamps a collision-proof UTC-second timestamp."
            exit 1
          fi
          echo "No migration timestamp collisions with main."

      - name: Check secrets
        if: steps.migration_changes.outputs.changed == 'true'
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing+=(SUPABASE_PROJECT_REF)
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Supabase secrets missing::Cannot validate migrations: ${missing[*]} are not set. Add them under Settings → Secrets and variables → Actions. See docs/db-deploy-audit.md for the full list."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        if: steps.migration_changes.outputs.changed == 'true'
        with:
          version: 2.109.1  # pinned: "latest" hit a GitHub rate-limit and silently skipped a deploy (2026-07-27)

      - name: Validate migration push
        if: steps.migration_changes.outputs.changed == 'true'
        # --dry-run already fails non-zero on drift (remote-only versions,
        # local versions inserted before the last remote, duplicate-key
        # collisions). Pending branch migrations are OK on PRs as long as
        # Supabase can apply them after merge.
        run: npm run db:migrations:check

  push:
    name: Apply migrations to production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `environment: production-db` is retained ONLY for secret scoping —
    # SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD
    # live as Environment Secrets on this environment, not as repo-level
    # Actions secrets. Dropping the binding (PR #48) silently broke prod
    # pushes because `${{ secrets.* }}` returns empty without the
    # environment scope.
    #
    # The manual-approval gate that previously hung off this environment
    # added latency without catching real failures (collisions / drift) —
    # we rely on the PR-level dry-run (blocking via branch protection) +
    # the daily drift-detection workflow instead. If the env still has a
    # required-reviewers config, clear it under Settings → Environments
    # → production-db rather than removing this directive.
    environment: production-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: migration_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; applying/verifying migrations."
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^supabase/migrations/.*\.sql$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed on main; applying migrations."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed on main; skipping production DB push."
          fi

      - name: Refuse branch manual production push
        if: steps.migration_changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Manual db push must run from main::This workflow applies migrations to production. Re-run it from the main branch so branch-only migration files cannot be recorded in production before they exist on main."
          exit 1

      - name: Verify secrets
        if: steps.migration_changes.outputs.changed == 'true'
        # For the push path we WANT to fail loudly: a missing secret means
        # nothing got applied, which is silent data drift waiting to happen.
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing+=(SUPABASE_PROJECT_REF)
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Supabase secrets missing::Cannot apply migrations: ${missing[*]} are not set. Add them under Settings → Environments → production-db → Environment secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        if: steps.migration_changes.outputs.changed == 'true'
        with:
          version: 2.109.1  # pinned: "latest" hit a GitHub rate-limit and silently skipped a deploy (2026-07-27)

      - name: Apply pending migrations
        if: steps.migration_changes.outputs.changed == 'true'
        # The script first rejects duplicate local migration versions, then
        # uses --include-all so a PR that was valid when reviewed still applies
        # if another migration reached main first.
        run: npm run db:migrations:apply

      - name: Deploy application deletion function
        if: steps.migration_changes.outputs.changed == 'true'
        run: supabase functions deploy delete-application --no-verify-jwt

      - name: Verify production has no pending migrations
        if: steps.migration_changes.outputs.changed == 'true'
        run: npm run db:migrations:clean
