name: Supabase migration drift check

# Catches the failure mode that started the May–June migration mess:
# someone applies SQL via Supabase Dashboard / MCP / SQL Editor without
# committing the matching file to `supabase/migrations/`. The first sign
# of trouble is `supabase db push` exploding on the next merge, days or
# weeks later.
#
# This workflow runs every morning (and on demand) — it asks Supabase
# `db push --dry-run` for the diff. If the CLI reports either:
#   • "Remote migration versions not found in local migrations directory"
#   • "Found local migration files to be inserted before the last
#      migration on remote database"
# the job fails and opens / updates a tracking issue so the gap is
# visible the next morning instead of after a merge breaks production.
#
# Required secrets (same set as db-push.yml):
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROJECT_REF
#   SUPABASE_DB_PASSWORD

on:
  schedule:
    # Daily at 03:00 UTC ≈ 08:30 IST — drift surfaces before anyone starts
    # opening migration-touching PRs.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  drift:
    name: Detect migration drift
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_PROJECT_REF" ]  && missing+=(SUPABASE_PROJECT_REF)
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Drift check skipped::Missing secrets: ${missing[*]}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest

      - name: Link to Supabase project
        if: steps.gate.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Detect drift
        id: detect
        if: steps.gate.outputs.skip != 'true'
        run: |
          set +e
          OUTPUT=$(supabase db push --dry-run 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          # Mask any accidental URL leaks before exposing the output to a
          # later step (GitHub already masks the secret value itself, but
          # we run it through cat -v for safety).
          {
            echo 'output<<EOF'
            echo "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Migration drift detected::supabase db push --dry-run exited $STATUS"
          fi
          exit $STATUS

      - name: Open / update tracking issue on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          OUTPUT: ${{ steps.detect.outputs.output }}
        with:
          script: |
            const body = [
              '⚠️ **Migration drift detected** — local repo and Supabase production are out of sync.',
              '',
              'Most common cause: SQL was applied to remote via the Supabase Dashboard, MCP, or SQL Editor without committing the matching `supabase/migrations/<remote_timestamp>_<name>.sql` file.',
              '',
              '**Output from `supabase db push --dry-run`:**',
              '',
              '```',
              process.env.OUTPUT || '(no output captured)',
              '```',
              '',
              '**To fix:**',
              '1. Pull the missing SQL from `supabase_migrations.schema_migrations.statements` for each remote-only version (or use `supabase db pull`).',
              '2. Save each as `supabase/migrations/<exact_remote_version>_<name>.sql`.',
              '3. Open a PR — the dry-run check in `Supabase DB push` will go green once local matches remote.',
              '',
              `_Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            // Reuse an existing open drift-tracking issue if one exists,
            // so we don't spam a new one per day.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'migration-drift',
              per_page: 1,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.notice(`Updated existing drift issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: '⚠️ Supabase migration drift between repo and production',
                body,
                labels: ['migration-drift'],
              });
              core.notice(`Opened drift issue #${created.number}`);
            }
