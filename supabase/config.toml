# Anonymous applicants list their already-uploaded docs from the apply portal.
# The function authorizes by application identity, so gateway JWT verification
# would only reject valid users carrying stale browser sessions.
[functions.list-app-docs]
verify_jwt = false

# Anonymous academic-partner on-behalf applicants write audit events through
# a scoped token. The function validates that token itself.
[functions.academic-partner-on-behalf-audit]
verify_jwt = false

# Academic partners complete applications from a magic-link token, not from a
# Supabase browser session. The function validates the token and partner scope.
[functions.academic-partner-application-action]
verify_jwt = false

# Public endpoint hit by anonymous applicants opening a magic link.
# JWT verification at the gateway breaks the redeem flow whenever the browser
# carries a stale/expired/malformed session JWT (the gateway returns 401
# UNAUTHORIZED_LEGACY_JWT before the function even runs). The function does
# its own auth via the time-bound token in the request body — no JWT needed.
[functions.redeem-apply-link]
verify_jwt = false

# Called by pg_cron via service-role bearer — the function does its own auth
# off SUPABASE_SERVICE_ROLE_KEY presence, so we skip gateway JWT verification.
[functions.personal-doc-reminder-cron]
verify_jwt = false

# Entrance-exam registration check — sends exam_registration_check to unknown
# leads. Intended daily via pg_cron; kept UNSCHEDULED until the Meta templates
# are approved. Supports POST { dry_run: true } for a no-send preview.
[functions.exam-registration-check-cron]
verify_jwt = false

# Called by pg_cron every 30 min during business hours IST.
[functions.lead-bucket-backlog-cron]
verify_jwt = false

# Called by pg_cron at 12:01 AM IST.
[functions.daily-lead-summary-email]
verify_jwt = false

# Called both by signed-in users (from /my-docs) and by whatsapp-webhook
# with the service-role key. The gateway can't validate the new opaque
# sb_secret service-role tokens, so let the function handle auth itself.
[functions.extract-personal-doc]
verify_jwt = false

# Anonymous applicants upload documents through this function. The gateway
# JWT check would 401 anyone with a stale/expired session token before the
# function runs (same failure mode as redeem-apply-link). The function does
# its own identity check by matching (application_id, phone) against the
# applications row, so JWT verification at the gateway is redundant.
[functions.apply-portal-upload-doc]
verify_jwt = false

